<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SYLVER — App opening animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0b0c;color:#e9eaec;font:500 13px/1.4 'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.stage{flex:1 1 0;min-height:0;aspect-ratio:9/16;max-width:100%;border-radius:22px;overflow:hidden;background:#050505;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px -30px #000}
.stage svg{display:block;width:100%;height:100%}
.bar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%;max-width:760px}
.b{border:0;border-radius:999px;padding:10px 20px;font:600 13px 'Manrope',system-ui,sans-serif;letter-spacing:-.01em;cursor:pointer;background:#f2f3f5;color:#0a0a0b;transition:transform .2s,box-shadow .2s}
.b:hover{transform:translateY(-1px);box-shadow:0 0 22px rgba(255,255,255,.28)}.b:active{transform:scale(.97)}
.b.g{background:transparent;color:#e9eaec;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}.b.g:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.f{display:flex;align-items:center;gap:10px;color:#a3a6ad}
.f b{font:500 12px 'Geist Mono',ui-monospace,monospace;color:#e9eaec;min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:rgba(255,255,255,.2)}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(255,255,255,.2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#f2f3f5;margin-top:-5.5px;box-shadow:0 0 12px rgba(255,255,255,.4)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#f2f3f5}
#speed{width:120px}#scrub{flex:1 1 220px;min-width:160px}
.row{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%}
.chk{display:flex;align-items:center;gap:8px;color:#a3a6ad;cursor:pointer;user-select:none}.chk input{accent-color:#e9eaec;width:15px;height:15px}
body.bare{background:#050505;overflow:hidden}body.bare .app{width:100%;height:100%;min-height:100svh;padding:0;gap:0;justify-content:center}body.bare .bar{display:none}body.bare .stage{width:100%;height:100%;min-height:100%;max-width:100%;max-height:100%;flex:1 1 auto;aspect-ratio:auto;border-radius:0;box-shadow:none;background:radial-gradient(ellipse at 50% 50%,#111315,#050505 72%)}body.bare .stage svg{width:100%;height:100%;object-fit:contain} @media(min-width:821px){body.bare .stage{width:100%;height:100%;padding:2vh 3vw}body.bare .stage svg{max-width:100%;max-height:100%}} @media(max-width:820px){body.bare .stage{padding:0}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stageWrap">
    <svg id="stage" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet" role="img" aria-label="SYLVER opening animation">
      <defs>
        <!-- chrome: bright top, dark horizon line, bright reflection below -->
        <linearGradient id="chrome" gradientUnits="userSpaceOnUse" x1="0" y1="-92" x2="0" y2="92">
          <stop offset="0" stop-color="#f8f9fb"/><stop offset=".24" stop-color="#c3c8cf"/><stop offset=".45" stop-color="#6a6f77"/>
          <stop offset=".485" stop-color="#2c2f34"/><stop offset=".5" stop-color="#e9ecef"/><stop offset=".68" stop-color="#a9afb7"/>
          <stop offset=".86" stop-color="#dadee2"/><stop offset="1" stop-color="#f3f5f7"/>
        </linearGradient>
        <linearGradient id="sweep" gradientUnits="userSpaceOnUse" gradientTransform="rotate(18)" x1="-140" y1="0" x2="140" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="sphere" gradientUnits="userSpaceOnUse" cx="-5" cy="-7" r="24">
          <stop offset="0" stop-color="#fff"/><stop offset=".32" stop-color="#dfe2e6"/><stop offset=".68" stop-color="#8b9199"/><stop offset="1" stop-color="#3a3d42"/>
        </radialGradient>
        <linearGradient id="ringG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f4f6f8"/><stop offset=".3" stop-color="#aab0b8"/><stop offset=".47" stop-color="#4a4e55"/>
          <stop offset=".5" stop-color="#e9ecef"/><stop offset=".72" stop-color="#a7adb5"/><stop offset="1" stop-color="#f4f6f8"/>
        </linearGradient>
        <!-- the six letters as vector outlines; their d attributes are morphed by the timeline -->
        <path id="P0" fill-rule="nonzero"/><path id="P1" fill-rule="nonzero"/><path id="P2" fill-rule="nonzero"/>
        <path id="P3" fill-rule="nonzero"/><path id="P4" fill-rule="nonzero"/><path id="P5" fill-rule="nonzero"/>
      </defs>
      <rect id="bg" width="1080" height="1920" fill="#050505"/>
      <g transform="translate(540 960)">
        <g id="rings"></g>
        <g id="wm"><g id="ls">
          <g id="gBase"></g><g id="gSphere"></g><g id="gSweep"></g><g id="gRim"></g>
        </g></g>
      </g>
    </svg>
  </div>
  <div class="bar">
    <div class="row">
      <button class="b" id="bReplay" type="button">Replay</button>
      <button class="b g" id="bPlay" type="button">Pause</button>
      <label class="f">Speed <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"><b id="speedVal">1.00×</b></label>
      <label class="chk"><input id="loop" type="checkbox"> Loop</label>
    </div>
    <div class="row">
      <label class="f" style="flex:1 1 320px">Timeline <input id="scrub" type="range" min="0" max="1000" step="1" value="0"><b id="time">0.00 s</b></label>
    </div>
  </div>
</div>

function smooth(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)}
function outCubic(t){return 1-Math.pow(1-t,3)}
function inOutCubic(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function inOutQuart(t){return t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2}
function inOutSine(t){return -(Math.cos(Math.PI*t)-1)/2}
function outExpo(t){return t>=1?1:1-Math.pow(2,-10*t)}
function outQuart(t){return 1-Math.pow(1-t,4)}
/* ---- build the scene ---- */
var NS='http://www.w3.org/2000/svg',$=function(id){return document.getElementById(id)};
function mk(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
var XL='http://www.w3.org/1999/xlink';
function use(parent,i,attrs){var u=mk('use',attrs,parent);u.setAttribute('href','#P'+i);u.setAttributeNS(XL,'xlink:href','#P'+i);return u}
for(var i=0;i<6;i++){use($('gBase'),i,{fill:'url(#chrome)'});use($('gSphere'),i,{fill:'url(#sphere)'});use($('gSweep'),i,{fill:'url(#sweep)'});use($('gRim'),i,{fill:'none',stroke:'#ffffff','stroke-opacity':'.28','stroke-width':'1.3','stroke-linejoin':'round'})}
var RG=[];for(var k=0;k<CFG.rings.count;k++){RG.push({ring:mk('circle',{fill:'none',stroke:'url(#ringG)',cx:0,cy:0,r:1,opacity:0},$('rings')),hl:mk('circle',{fill:'none',stroke:'#ffffff','stroke-linecap':'round',cx:0,cy:0,r:1,opacity:0},$('rings'))})}
/* ---- letter geometry ---- */
function pathFor(letter,g,dots){
  var s='',pcs=letter.pieces,tr=inOutQuart(g),m=inOutCubic(clamp((g-.06)/.94)),mh=Math.min(1,m*1.4),R=CFG.dot.radius;
  for(var p=0;p<pcs.length;p++){var pc=pcs[p],P=pc.p,n=P.length/2,cx=pc.c[0]*(1-tr),cy=pc.c[1]*(1-tr);
    for(var i=0;i<n;i++){var dx=P[2*i]-pc.c[0],dy=P[2*i+1]-pc.c[1],x,y;
      if(pc.h){x=cx+dx*(1-mh);y=cy+dy*(1-mh)}
      else{var a=pc.d*2*Math.PI*i/n;x=cx+dx*(1-m)+R*m*Math.cos(a);y=cy+dy*(1-m)+R*m*Math.sin(a)}
      s+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)}
    s+='Z'}
  return s}
var D0=[],DDOT=[];for(var i=0;i<6;i++){D0.push(pathFor(GEOM[i],0));DDOT.push(pathFor(GEOM[i],1))}
var gapSpan=CFG.gather.end-CFG.gather.start-2*CFG.gather.stagger;
/* ---- the timeline ---- */
function render(t){
  var C=CFG,wm=$('wm'),ls=$('ls');
  // intro: the wordmark settles in
  var ip=outCubic(clamp((t-C.intro.start)/(C.intro.end-C.intro.start),0,1));
  var gp=clamp((t-C.gather.start)/(C.gather.end-C.gather.start),0,1);
  var dotFade=1-smooth(C.rings.start-.04,C.rings.start+.32,t);
  wm.setAttribute('opacity',(ip*dotFade).toFixed(3));
  wm.setAttribute('transform','translate(0 '+((1-ip)*C.intro.rise).toFixed(2)+')');
  // chrome light sweep across the letters
  var sp=inOutSine(clamp((t-C.sweep.start)/(C.sweep.end-C.sweep.start),0,1)),px=lerp(-640,640,sp),sw=$('sweep');
  sw.setAttribute('x1',px-C.sweep.band/2);sw.setAttribute('x2',px+C.sweep.band/2);
  $('gSweep').setAttribute('opacity',(1-smooth(0,.22,gp)).toFixed(3));
  $('gRim').setAttribute('opacity',(1-smooth(.05,.45,gp)).toFixed(3));
  $('gSphere').setAttribute('opacity',smooth(.6,.97,inOutCubic(gp)).toFixed(3));
  // letters travel to the centre and morph into one dot
  for(var i=0;i<6;i++){var d;
    if(t<=C.gather.start)d=D0[i];else if(t>=C.gather.end)d=DDOT[i];
    else{var delay=(2.5-Math.abs(i-2.5))*C.gather.stagger;d=pathFor(GEOM[i],clamp((t-C.gather.start-delay)/gapSpan,0,1))}
    $('P'+i).setAttribute('d',d)}
  // the dot breathes just before the rings are born
  var pu=clamp((t-C.dot.pulseStart)/(C.dot.pulseEnd-C.dot.pulseStart),0,1),sc=1+(C.dot.pulseScale-1)*Math.sin(Math.PI*pu);
  ls.setAttribute('transform','scale('+sc.toFixed(4)+')');
  // concentric rings expand past the screen edges and dissolve
  var R=C.rings;
  for(var k=0;k<R.count;k++){var te=(t-R.start-k*R.stagger)/R.dur,g=RG[k];
    if(te<=0||te>=1.2){g.ring.setAttribute('opacity',0);g.hl.setAttribute('opacity',0);continue}
    var e=outQuart(clamp(te,0,1)),r=C.dot.radius+(R.maxR-C.dot.radius)*e,w=lerp(R.w0,R.w1,Math.pow(e,.6)),op=(1-smooth(R.fadeFrom,R.fadeTo,r))*clamp(te*10,0,1);
    g.ring.setAttribute('r',r.toFixed(2));g.ring.setAttribute('stroke-width',w.toFixed(2));g.ring.setAttribute('opacity',op.toFixed(3));
    var circ=2*Math.PI*r,arc=circ*C.highlight.arc/2,ang=k*.9+C.highlight.speeds[k%C.highlight.speeds.length]*(t-R.start);
    g.hl.setAttribute('r',r.toFixed(2));g.hl.setAttribute('stroke-width',(w*.62).toFixed(2));
    g.hl.setAttribute('stroke-dasharray',arc.toFixed(1)+' '+(circ/2-arc).toFixed(1));g.hl.setAttribute('stroke-dashoffset',(-ang*r).toFixed(1));
    g.hl.setAttribute('opacity',(op*.92).toFixed(3))}
}
/* ---- player ---- */
var S={t:0,playing:false,speed:1,loop:false,raf:0,last:0};
var el={replay:$('bReplay'),play:$('bPlay'),speed:$('speed'),speedVal:$('speedVal'),loop:$('loop'),scrub:$('scrub'),time:$('time')};
function ui(){el.scrub.value=Math.round(S.t/CFG.duration*1000);el.time.textContent=S.t.toFixed(2)+' s';el.play.textContent=S.playing?'Pause':'Play'}
function seek(t){S.t=clamp(t,0,CFG.duration);render(S.t);ui()}
function tick(now){if(!S.playing)return;S.t+=(now-S.last)/1000*S.speed;S.last=now;
  if(S.t>=CFG.duration){render(CFG.duration);if(S.loop){S.t=0;S.last=now}else{S.t=CFG.duration;S.playing=false;ui();window.dispatchEvent(new CustomEvent('sylver-intro-complete'));return}}
  render(S.t);ui();S.raf=requestAnimationFrame(tick)}
function play(){if(S.playing)return;if(S.t>=CFG.duration)S.t=0;S.playing=true;S.last=performance.now();S.raf=requestAnimationFrame(tick);ui()}
function pause(){S.playing=false;cancelAnimationFrame(S.raf);ui()}
function replay(){pause();S.t=0;render(0);play()}
function setSpeed(x){S.speed=clamp(+x||1,.1,4);el.speed.value=S.speed;el.speedVal.textContent=S.speed.toFixed(2)+'×'}
el.replay.onclick=replay;el.play.onclick=function(){S.playing?pause():play()};
el.speed.oninput=function(){setSpeed(this.value)};el.loop.onchange=function(){S.loop=this.checked};
el.scrub.oninput=function(){pause();seek(this.value/1000*CFG.duration)};
document.addEventListener('keydown',function(e){if(e.target&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox')return;
  if(e.code==='Space'){e.preventDefault();S.playing?pause():play()}else if(e.key==='r'||e.key==='R')replay();
  else if(e.key==='ArrowRight'){pause();seek(S.t+.1)}else if(e.key==='ArrowLeft'){pause();seek(S.t-.1)}});
window.SylverIntro={play:play,pause:pause,replay:replay,seek:seek,setSpeed:setSpeed,config:CFG,render:render,get time(){return S.t}};
(function(){var q=new URLSearchParams(location.search);
  if(q.get('controls')==='0')document.body.classList.add('bare');
  if(q.get('speed'))setSpeed(q.get('speed'));
  if(q.get('loop')==='1'){S.loop=true;el.loop.checked=true}
  render(0);ui();if(q.get('autoplay')!=='0')setTimeout(play,350)})();
</script>

<script>window.addEventListener('sylver-intro-complete',function(){try{if(window.parent&&window.parent!==window)window.parent.postMessage('sylver-intro-complete','*')}catch(e){}});</script>
</body>
